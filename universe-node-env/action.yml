name: Universe Node environment
description: >-
  Verifies the pinned Node.js and npm that the runner host already carries and
  activates an exact, pre-warmed dependency tree from the host's shared store.
  Nothing is downloaded and nothing is installed on a warm runner; a runner
  that is missing its toolchain fails with a provisioning error.

inputs:
  working-directory:
    description: Directory holding package.json and package-lock.json.
    required: false
    default: .
  node-version-file:
    description: File holding the pinned Node.js version.
    required: false
    default: .nvmrc
  install:
    description: Set to false to verify the toolchain without touching dependencies.
    required: false
    default: 'true'
  npm-install-args:
    description: Extra flags for the one cold npm ci that builds a new fingerprint.
    required: false
    default: ''
  store-root:
    description: >-
      Directory holding the dependency store on a persistent runner. Defaults
      to the host's UNIVERSE_DEP_STORE. Ignored on ephemeral runners, which use
      actions/cache instead.
    required: false
    default: ''

outputs:
  node-version:
    description: Node.js version now on PATH.
    value: ${{ steps.plan.outputs.node-version }}
  npm-version:
    description: npm version now on PATH.
    value: ${{ steps.plan.outputs.npm-version }}
  dependency-key:
    description: Content-addressed dependency fingerprint.
    value: ${{ steps.plan.outputs.dependency-key }}
  dependency-state:
    description: hit, miss or empty.
    value: ${{ steps.deps.outputs.state }}
  persistent-runner:
    description: true when the runner keeps its disk between jobs.
    value: ${{ steps.plan.outputs.persistent }}

runs:
  using: composite
  steps:
    - name: Verify pre-warmed runtime
      id: toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_VERSION_FILE: ${{ inputs.node-version-file }}
      run: bash "${{ github.action_path }}/resolve-toolchain.sh"

    - name: Verify dependency fingerprint
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NPM_INSTALL_ARGS: ${{ inputs.npm-install-args }}
        STORE_ROOT_INPUT: ${{ inputs.store-root }}
      run: bash "${{ github.action_path }}/plan-dependencies.sh"

    # Ephemeral runners have no local store; the Actions cache stands in.
    - name: Restore dependency state (ephemeral runner)
      id: remote-cache
      if: inputs.install == 'true' && steps.plan.outputs.no-dependencies != 'true' && steps.plan.outputs.persistent != 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.plan.outputs.node-modules-path }}
        key: ${{ steps.plan.outputs.dependency-key }}
        enableCrossOsArchive: false

    - name: Activate pre-warmed dependencies
      id: deps
      if: inputs.install == 'true' && steps.plan.outputs.no-dependencies != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEPENDENCY_KEY: ${{ steps.plan.outputs.dependency-key }}
        DEPENDENCY_STORE: ${{ steps.plan.outputs.store-root }}
        PERSISTENT_RUNNER: ${{ steps.plan.outputs.persistent }}
        REMOTE_CACHE_HIT: ${{ steps.remote-cache.outputs.cache-hit }}
        NPM_INSTALL_ARGS: ${{ inputs.npm-install-args }}
      run: bash "${{ github.action_path }}/resolve-dependencies.sh"
