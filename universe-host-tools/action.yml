name: Universe host tools
description: >-
  Provides the host toolchain the retired Universe fleets preinstalled (PowerShell,
  database clients, protobuf, OpenSSL headers, musl, git-lfs) on universe-runners-1,
  where the shared github-runner account has no root. Tools are installed once per
  host into a shared user-space prefix under a lock, then exposed to the job.
inputs:
  packages:
    description: Extra Ubuntu packages to provide (space separated).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Provide universe host tools
      shell: bash
      env:
        UHT_EXTRA_PACKAGES: ${{ inputs.packages }}
      run: bash "${{ github.action_path }}/install.sh"
