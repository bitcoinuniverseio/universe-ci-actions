name: Fleet host inventory

# Read-only. Reports the shape and current pressure of whichever Universe hosts
# pick up these jobs: CPU, memory, disks and RAID, filesystems, I/O, runner and
# job counts, Docker and the shared stores. No sudo, no environment dump; a host
# is identified by a hash of its machine-id so samples can be grouped by host.
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    # One job: on 2026-11-15 every [universe] runner (universe-1..38) was on the
    # same host, so more samples only add load to a saturated machine.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 10
    steps:
      - name: Host inventory
        shell: bash
        run: |
          set +e
          echo '## balancer service and timer'
          systemctl cat universe-resource-balancer.service universe-resource-balancer.timer
          echo '## balancer properties'
          systemctl show universe-resource-balancer.service -p ExecStart -p FragmentPath -p DropInPaths --no-pager
          systemctl list-timers --all --no-pager --plain | grep -iE 'universe|resource|budget'
          echo '## generator source references'
          grep -R -l -E '95-live-hardware|runners[.]slice' /usr/lib/systemd/system-generators /etc/systemd/system-generators 2>/dev/null | head -30
          exit 0
