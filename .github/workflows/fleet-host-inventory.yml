name: Fleet host inventory

# Read-only. Reports the shape and current pressure of whichever Universe hosts
# pick up these jobs: CPU, memory, disks and RAID, filesystems, I/O, runner and
# job counts, Docker and the shared stores. No sudo, no environment dump; a host
# is identified by a hash of its machine-id so samples can be grouped by host.
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    # One job: on 2026-11-15 every [universe] runner (universe-1..38) was on the
    # same host, so more samples only add load to a saturated machine.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 10
    steps:
      - name: Host inventory
        shell: bash
        run: |
          set +e
          echo '## slice and host demand'
          for s in runners.slice inference.slice system.slice user.slice; do d=/sys/fs/cgroup/$s; echo "-- $s"; for f in memory.current memory.high memory.max cpu.max cpu.stat memory.pressure cpu.pressure; do [ -r "$d/$f" ] && { printf '%s: ' "$f"; tr '\n' ' ' < "$d/$f"; echo; }; done; done
          grep -E '^(MemTotal|MemAvailable|SwapTotal|SwapFree):' /proc/meminfo
          echo '## maintenance permissions'
          timeout 5 sudo -n -l 2>&1 | head -35
          exit 0
