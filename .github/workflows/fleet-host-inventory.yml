name: Fleet host inventory

# Read-only. Reports the shape and current pressure of whichever Universe hosts
# pick up these jobs: CPU, memory, disks and RAID, filesystems, I/O, runner and
# job counts, Docker and the shared stores. No sudo, no environment dump; a host
# is identified by a hash of its machine-id so samples can be grouped by host.
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    # One job: on 2026-11-15 every [universe] runner (universe-1..38) was on the
    # same host, so more samples only add load to a saturated machine.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 10
    steps:
      - name: Host inventory
        shell: bash
        run: |
          set +e
          echo '## resource policy source'
          ls -l /usr/local/bin/universe-resource-balancer /etc/systemd/system-generators/universe-resources-generator
          grep -n -E '(runner|inference|memory|Memory|cpu|CPU|quota|Quota|set-property|MemTotal|MemAvailable|systemctl)' /usr/local/bin/universe-resource-balancer /etc/systemd/system-generators/universe-resources-generator | grep -viE '(secret|token|password|credential)' | head -250
          exit 0
