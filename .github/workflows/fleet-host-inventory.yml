name: Fleet host inventory

# Read-only. Reports the shape and current pressure of whichever Universe hosts
# pick up these jobs: CPU, memory, disks and RAID, filesystems, I/O, runner and
# job counts, Docker and the shared stores. No sudo, no environment dump; a host
# is identified by a hash of its machine-id so samples can be grouped by host.
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  inventory:
    # One job: on 2026-11-15 every [universe] runner (universe-1..38) was on the
    # same host, so more samples only add load to a saturated machine.
    runs-on: [self-hosted, Linux, X64, universe]
    timeout-minutes: 10
    steps:
      - name: Host inventory
        shell: bash
        run: |
          set +e
          echo '## shared slice configuration'
          systemctl cat runners.slice
          echo '## shared slice properties'
          systemctl show runners.slice -p FragmentPath -p DropInPaths -p MemoryHigh -p MemoryMax -p CPUQuotaPerSecUSec -p CPUWeight --no-pager
          echo '## possible controller units'
          systemctl list-units --type=service --all --no-pager --plain --no-legend | grep -iE 'govern|budget|pressure|resource|hardware'
          echo '## configuration source references'
          grep -R -l -E 'runners[.]slice|95-live-hardware' /etc/systemd/system /usr/lib/systemd/system-generators /etc/systemd/system-generators 2>/dev/null | head -60
          exit 0
