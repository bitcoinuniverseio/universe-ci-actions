name: Portable MySQL fixture
description: Start an isolated MySQL test fixture on certified Linux or Windows container builders.

inputs:
  image:
    description: MySQL image pinned by digest.
    required: true
  database:
    description: Database created for the test job.
    required: true
  user:
    description: Non-root database user created for the test job.
    required: false
    default: universe_ci
  password:
    description: Password for the non-root test user.
    required: true
  root_password:
    description: Root password for the isolated fixture.
    required: true
  connection_host:
    description: Hostname the runner uses to reach Docker's loopback-published port.
    required: false
    default: 127.0.0.1

outputs:
  host:
    description: Runner-reachable hostname for the fixture.
  port:
    description: Dynamically allocated host port.
  container:
    description: Run-scoped container name.

runs:
  using: node24
  main: main.mjs
  post: post.mjs

