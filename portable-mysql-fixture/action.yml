name: Portable MySQL fixture
description: Start an isolated MySQL test fixture on certified Linux container builders, reachable from a native or a containerized runner.

inputs:
  image:
    description: MySQL image pinned by digest.
    required: true
  database:
    description: Database created for the test job.
    required: true
  user:
    description: Non-root database user created for the test job.
    required: false
    default: universe_ci
  password:
    description: Password for the non-root test user.
    required: true
  root_password:
    description: Root password for the isolated fixture.
    required: true
  connection_host:
    description: >-
      Host the caller reaches the fixture through. `auto` proves the route by
      connecting: the runner's own loopback first, then the Docker bridge
      gateway and host.docker.internal for a runner that is itself a
      container. An explicit host is used as given and fails loudly when it
      is not reachable.
    required: false
    default: auto

outputs:
  host:
    description: The host that proved reachable for the fixture.
  port:
    description: Dynamically allocated host port.
  container:
    description: Run-scoped container name.

runs:
  using: node24
  main: main.mjs
  post: post.mjs
